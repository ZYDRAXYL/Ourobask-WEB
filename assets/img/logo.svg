<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ourobask">
  <title>Ourobask</title>
  <defs>
    <linearGradient id="ob-ring" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7d5260"/>
      <stop offset="0.55" stop-color="#6750a4"/>
      <stop offset="1" stop-color="#4f378b"/>
    </linearGradient>
  </defs>
  <!-- ouroboros: วงแหวนงูกินหางตัวเอง -->
