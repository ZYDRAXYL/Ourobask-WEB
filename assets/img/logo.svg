  <path d="M14.7 14.7a6.6 6.6 0 1 0 9.2 1.4z" fill="#4f378b"/>
  <circle cx="19.6" cy="15.4" r="1.5" fill="#eaddff"/>
  <!-- เครื่องหมายถูก: งานที่ทำเสร็จ -->
